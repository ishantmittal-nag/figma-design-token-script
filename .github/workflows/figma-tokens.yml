name: Figma Design Tokens

on:
  workflow_dispatch:

env:
  FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
  FIGMA_FILE_KEY: ${{ secrets.FIGMA_FILE_KEY }}

jobs:
  extract-and-generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Extract Figma variables
        run: node extract-variables.js

      - name: Generate CSS tokens
        run: node generate-css.js

      - name: Upload tokens
        uses: actions/upload-artifact@v4
        with:
          name: figma-tokens
          path: |
            variables.json
            tokens/
