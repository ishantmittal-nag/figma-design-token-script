name: Sync Figma Tokens

# This branch (tokens-sync) is intentionally isolated: it holds only the
# files needed to run sync-figma-tokens.js - no application code, no
# unrelated pipelines. Trigger it manually from the Actions tab (only shows
# a "Run workflow" button once this file also exists on the repo's default
# branch - see README.md's Troubleshooting section), or via
# `gh workflow run sync-figma-tokens.yml --ref tokens-sync`, or via
# `git push` to this branch.
#
# Note: GitHub only fires `schedule` triggers on the repository's default
# branch, so the cron below stays dormant unless this workflow file also
# lives on that branch. It's kept here so the schedule is ready to go if
# that ever changes; workflow_dispatch is the reliable way to run this today.
on:
  workflow_dispatch:
    inputs:
      figma_file_key:
        description: "Figma file key to sync (overrides the FIGMA_FILE_KEY repo variable for this run)"
        required: false
      figma_api_base_url:
        description: "Figma API base URL (overrides the FIGMA_API_BASE_URL repo variable for this run; leave blank for the default Figma API)"
        required: false
  push:
    branches:
      - tokens-sync
    paths-ignore:
      - "tokens/**"
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  sync-tokens:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: tokens-sync

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Sync Figma tokens
        id: sync
        env:
          # FIGMA_TOKEN is the only actual credential here, so it stays a
          # secret. FIGMA_FILE_KEY and the API base URL are just config, not
          # secrets - they come from repo Variables (Settings > Secrets and
          # variables > Actions > Variables) so they can be changed from the
          # GitHub UI without touching code, with a per-run override via the
          # workflow_dispatch inputs above. secrets.FIGMA_FILE_KEY is a
          # transitional fallback for repos that haven't added the
          # FIGMA_FILE_KEY repo Variable yet - once it's set, add the
          # Variable and this fallback (plus the old secret) can be removed.
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          FIGMA_FILE_KEY: ${{ inputs.figma_file_key || vars.FIGMA_FILE_KEY || secrets.FIGMA_FILE_KEY }}
          FIGMA_API_BASE_URL: ${{ inputs.figma_api_base_url || vars.FIGMA_API_BASE_URL }}
          DOTENV_CONFIG_QUIET: "true"
        run: |
          set +e
          node sync-figma-tokens.js
          CODE=$?
          set -e
          echo "sync_exit_code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Commit and push updated tokens
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tokens/
          if git diff --cached --quiet; then
            echo "No token changes to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: sync design tokens from Figma"
            git push origin HEAD:tokens-sync
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      # sync-figma-tokens.js exits non-zero for two different reasons that
      # need different treatment here: a real error (bad token, API/network
      # failure) never reaches the file-writing code, so nothing gets
      # committed above - that's an actual infra failure, fail loud. A
      # breaking-change diff (e.g. a removed variable) DOES write and commit
      # successfully; that's a legitimate result the sync produced, not a
      # broken pipeline, so it's surfaced as a summary instead of a red X.
      - name: Report breaking changes (non-fatal)
        if: steps.sync.outputs.sync_exit_code != '0' && steps.commit.outputs.committed == 'true'
        run: |
          echo "## ⚠️ Breaking token changes detected" >> "$GITHUB_STEP_SUMMARY"
          echo "The sync completed and was committed, but see \`tokens/diff-latest.json\` for details." >> "$GITHUB_STEP_SUMMARY"

      - name: Fail job if the sync script errored
        if: steps.sync.outputs.sync_exit_code != '0' && steps.commit.outputs.committed != 'true'
        run: |
          echo "sync-figma-tokens.js exited with code ${{ steps.sync.outputs.sync_exit_code }} and nothing was committed - this is a real failure (bad credentials, Figma API error, etc.), not a token diff. Check the 'Sync Figma tokens' step's log above."
          exit 1
