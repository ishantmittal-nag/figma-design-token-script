name: Sync Figma Tokens

# Dedicated, tokens-only counterpart to design-sync.yml (which runs both
# tokens and components together on a schedule). This one is manual-trigger
# only - it's for someone who wants to sync just tokens on demand without
# also running the components sync. Like design-sync.yml, it opens a PR
# rather than pushing straight to main, so a bad or unexpected sync gets a
# review step before landing.
on:
  workflow_dispatch:
    inputs:
      figma_file_key:
        description: "Figma file key to sync (overrides the FIGMA_FILE_KEY repo variable for this run)"
        required: false
      figma_api_base_url:
        description: "Figma API base URL (overrides the FIGMA_API_BASE_URL repo variable for this run; leave blank for the default Figma API)"
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-tokens:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Sync Figma tokens
        id: sync
        env:
          # FIGMA_TOKEN is the only actual credential here, so it stays a
          # secret. FIGMA_FILE_KEY and the API base URL are just config, not
          # secrets - they come from repo Variables (Settings > Secrets and
          # variables > Actions > Variables) so they can be changed from the
          # GitHub UI without touching code, with a per-run override via the
          # workflow_dispatch inputs above. secrets.FIGMA_FILE_KEY is a
          # transitional fallback for repos that haven't added the
          # FIGMA_FILE_KEY repo Variable yet.
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          FIGMA_FILE_KEY: ${{ inputs.figma_file_key || vars.FIGMA_FILE_KEY || secrets.FIGMA_FILE_KEY }}
          FIGMA_API_BASE_URL: ${{ inputs.figma_api_base_url || vars.FIGMA_API_BASE_URL }}
          DOTENV_CONFIG_QUIET: "true"
        run: |
          set +e
          node sync-figma-tokens.js
          CODE=$?
          set -e
          echo "sync_exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      # Gate on the diff summary the script itself computed, not a raw
      # `git diff`: diff-latest.json's own timestamp field and a freshly
      # created snapshot entry make the working tree differ on every run
      # even when nothing actually changed, which would otherwise open a
      # no-op PR on every trigger.
      - name: Check for changes
        id: check-changes
        run: |
          CHANGES=0
          if [ -f tokens/diff-latest.json ]; then
            CHANGES=$(jq '.summary.added + .summary.removed + .summary.modified + .summary.renamed' tokens/diff-latest.json)
          else
            CHANGES=1
          fi
          if [ "$CHANGES" -gt 0 ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      # GitHub Actions expression strings don't process backslash escapes -
      # a literal \n inside a ${{ ... }} ternary/format() ends up in the PR
      # body as the two characters \n, not a line break. Building the full
      # message here (with real newlines) as a step output, via the same
      # heredoc-delimiter technique used elsewhere in this repo for
      # multi-line outputs, sidesteps that instead of fighting the
      # expression syntax.
      - name: Extract breaking changes info
        id: breaking-changes
        if: steps.check-changes.outputs.has_changes == 'true'
        run: |
          BREAKING=0
          if [ -f tokens/diff-latest.json ]; then
            BREAKING=$(jq '.summary.breakingChanges' tokens/diff-latest.json)
          fi
          echo "breaking_count=$BREAKING" >> "$GITHUB_OUTPUT"

          delimiter="ghadelimiter_$(date +%s%N)"
          if [ "$BREAKING" -gt 0 ]; then
            echo "has_breaking=true" >> "$GITHUB_OUTPUT"
            MESSAGE="### ⚠️ BREAKING CHANGES DETECTED

          **Breaking Changes Found:** ${BREAKING}

          This PR contains breaking changes that may require updates in the codebase. Please review carefully before merging."
          else
            echo "has_breaking=false" >> "$GITHUB_OUTPUT"
            MESSAGE="### ✅ No Breaking Changes
          This update is backward compatible."
          fi
          {
            echo "message<<$delimiter"
            echo "$MESSAGE"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Generate branch name
        id: branch-name
        if: steps.check-changes.outputs.has_changes == 'true'
        run: |
          TIMESTAMP=$(date +'%Y%m%d-%H%M%S')
          echo "branch_name=design-tokens/${TIMESTAMP}" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        if: steps.check-changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: "chore: sync design tokens from Figma"
          title: "${{ steps.breaking-changes.outputs.has_breaking == 'true' && '⚠️ chore: sync design tokens from Figma' || '✅ chore: sync design tokens from Figma' }}"
          body: |
            ## Figma Design Tokens Sync

            Automated sync of design tokens (variables) from Figma.

            ${{ steps.breaking-changes.outputs.message }}

            **Diff Report Available:** See `tokens/diff-latest.json` for detail.

            ### Files Changed
            - `tokens/variables-latest.json` - Latest variables
            - `tokens/snapshots/` - Timestamped + versioned snapshots
            - `tokens/*.css` - Generated CSS files
            - `tokens/index.css` - CSS imports index
            - `tokens/diff-latest.json` - Token change report

            ### Review Checklist
            - [ ] CSS output looks correct
            - [ ] Review breaking changes (if any)
            - [ ] No unexpected token deletions/renames
            - [ ] Figma version in snapshot key is accurate

            Auto-generated by Sync Figma Tokens workflow.
          branch: ${{ steps.branch-name.outputs.branch_name }}
          delete-branch: true
          labels: design-tokens,automated${{ steps.breaking-changes.outputs.has_breaking == 'true' && ',breaking-changes' || '' }}

      - name: Log sync summary
        run: |
          if [ "${{ steps.sync.outputs.sync_exit_code }}" != "0" ]; then
            echo "⚠️  sync-figma-tokens.js exited with code ${{ steps.sync.outputs.sync_exit_code }} - check the 'Sync Figma tokens' step's log above (could be a real error, or breaking changes were detected)."
          fi
          echo "✅ Figma tokens sync completed"
          if [ "${{ steps.check-changes.outputs.has_changes }}" = "true" ]; then
            echo "📝 Pull request opened: ${{ steps.branch-name.outputs.branch_name }}"
          else
            echo "ℹ️  No changes detected"
          fi
