name: Design Tokens Sync

on:
  schedule:
    # Run every day at midnight UTC (adjust timezone as needed)
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub UI

jobs:
  sync-tokens:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync Figma tokens
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          FIGMA_FILE_KEY: ${{ secrets.FIGMA_FILE_KEY }}
        run: node sync-figma-tokens.js || true

      - name: Sync Figma components
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          FIGMA_FILE_KEY: ${{ secrets.FIGMA_FILE_KEY }}
        run: node sync-figma-components.js || true

      - name: Check for changes
        id: check-changes
        run: |
          # Read the `hasChanges` / `breakingChanges` fields the scripts
          # themselves already computed, rather than re-deriving them here -
          # a raw `git diff` would look non-empty on every run regardless
          # (diff-latest.json's own timestamp field and a freshly-created
          # snapshot entry differ every time), and re-summing the four
          # change-count fields in bash would just duplicate what
          # saveDiffReport() in figma-sync-shared.js already decided.
          HAS_CHANGES=false
          TOKEN_BREAKING=0
          COMPONENT_BREAKING=0

          if [ -f tokens/diff-latest.json ]; then
            [ "$(jq -r '.hasChanges' tokens/diff-latest.json)" = "true" ] && HAS_CHANGES=true
            TOKEN_BREAKING=$(jq '.summary.breakingChanges' tokens/diff-latest.json)
          else
            # No previous snapshot to diff against yet - first run, always sync.
            HAS_CHANGES=true
          fi

          if [ -f components/diff-latest.json ]; then
            [ "$(jq -r '.hasChanges' components/diff-latest.json)" = "true" ] && HAS_CHANGES=true
            COMPONENT_BREAKING=$(jq '.summary.breakingChanges' components/diff-latest.json)
          else
            HAS_CHANGES=true
          fi

          TOTAL_BREAKING=$((TOKEN_BREAKING + COMPONENT_BREAKING))

          echo "has_changes=$HAS_CHANGES" >> $GITHUB_OUTPUT
          echo "breaking_count=$TOTAL_BREAKING" >> $GITHUB_OUTPUT
          if [ "$TOTAL_BREAKING" -gt 0 ]; then
            echo "has_breaking=true" >> $GITHUB_OUTPUT
          else
            echo "has_breaking=false" >> $GITHUB_OUTPUT
          fi

      - name: Extract component changes info
        id: component-changes
        if: steps.check-changes.outputs.has_changes == 'true'
        run: |
          delimiter="ghadelimiter_$(date +%s%N)"

          COMPONENT_LIST=""
          if [ -f components/diff-latest.json ]; then
            COMPONENT_LIST=$(jq -r '
              def line(prefix; item): "- \(prefix) **\(item.name // item.currentName)**" +
                (if item.codeLocation then " → `\(item.codeLocation)`" else " _(no Code Connect mapping found)_" end);
              ((.changes.added // [])[]    | line("➕ Added:";    .)),
              ((.changes.removed // [])[]  | line("➖ Removed:";  .)),
              ((.changes.modified // [])[] | line("♻️ Modified:"; .)),
              ((.changes.renamed // [])[]  | line("✏️ Renamed:";  .))
            ' components/diff-latest.json)
          fi

          if [ -z "$COMPONENT_LIST" ]; then
            COMPONENT_LIST="_No component changes in this sync._"
          fi

          {
            echo "list<<$delimiter"
            echo "$COMPONENT_LIST"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Generate branch name
        id: branch-name
        if: steps.check-changes.outputs.has_changes == 'true'
        run: |
          TIMESTAMP=$(date +'%Y%m%d-%H%M%S')
          BRANCH_NAME="design-tokens/${TIMESTAMP}"
          echo "branch_name=${BRANCH_NAME}" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.check-changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: "chore: sync design tokens from Figma"
          title: "${{ steps.check-changes.outputs.has_breaking == 'true' && '⚠️ ' || '✅ ' }}chore: design tokens sync"
          body: |
            ## Design Tokens Sync

            Automated sync of design tokens from Figma.

            ${{ steps.check-changes.outputs.has_breaking == 'true' && format('### ⚠️ BREAKING CHANGES DETECTED\n\n**Breaking Changes Found:** {0}\n\nThis PR contains breaking changes that may require updates in the codebase. Please review carefully before merging.\n\n', steps.check-changes.outputs.breaking_count) || '### ✅ No Breaking Changes\nThis update is backward compatible.' }}
            
            ### Changes Summary
            - Updated design token snapshots
            - Regenerated CSS files
            - Updated published component snapshots

            **Diff Report Available:** See `tokens/diff-latest.json` for detailed token changes, `components/diff-latest.json` for detailed component changes

            ### Components Changed
            ${{ steps.component-changes.outputs.list }}

            ### Files Changed
            - `tokens/variables-latest.json` - Latest variables
            - `tokens/snapshots/` - Timestamped + versioned snapshots
            - `tokens/*.css` - Generated CSS files
            - `tokens/index.css` - CSS imports index
            - `tokens/diff-latest.json` - Token change report
            - `components/components-latest.json` - Latest published components
            - `components/snapshots/` - Timestamped component snapshots
            - `components/diff-latest.json` - Component change report

            ### Review Checklist
            - [ ] CSS output looks correct
            - [ ] Review breaking changes (if any)
            - [ ] No unexpected token deletions/renames
            - [ ] No unexpected component deletions/renames - check the code locations listed above
            - [ ] Figma version in snapshot key is accurate
            
            Auto-generated by Design Tokens Sync workflow.
          branch: ${{ steps.branch-name.outputs.branch_name }}
          delete-branch: true
          labels: design-tokens,automated${{ steps.check-changes.outputs.has_breaking == 'true' && ',breaking-changes' || '' }}

      - name: Log sync summary
        run: |
          echo "✅ Design tokens sync completed"
          if [ "${{ steps.check-changes.outputs.has_changes }}" = "true" ]; then
            echo "📝 Pull request created: ${{ steps.branch-name.outputs.branch_name }}"
          else
            echo "ℹ️  No changes detected"
          fi
