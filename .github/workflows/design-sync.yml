name: Design Tokens Sync

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync-tokens:
    runs-on: ubuntu-latest
    timeout-minutes: 1

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '14'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Sync Figma tokens
        id: sync
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          FIGMA_FILE_KEY: ${{ secrets.FIGMA_FILE_KEY }}
        run: |
          node sync-figma-tokens.js || true
          EXIT_CODE=$?
          echo "sync_exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          exit 0

      - name: Sync Figma components
        id: sync-components
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          FIGMA_FILE_KEY: ${{ secrets.FIGMA_FILE_KEY }}
        run: |
          node sync-figma-components.js || true
          EXIT_CODE=$?
          echo "sync_exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          exit 0

      - name: Check for changes
        id: check-changes
        run: |
          TOTAL_CHANGES=0

          if [ -f tokens/diff-latest.json ]; then
            TOKEN_CHANGES=$(jq '.summary.added + .summary.removed + .summary.modified + .summary.renamed' tokens/diff-latest.json)
            TOTAL_CHANGES=$((TOTAL_CHANGES + TOKEN_CHANGES))
          else
            TOTAL_CHANGES=$((TOTAL_CHANGES + 1))
          fi

          if [ -f components/diff-latest.json ]; then
            COMPONENT_CHANGES=$(jq '.summary.added + .summary.removed + .summary.modified + .summary.renamed' components/diff-latest.json)
            TOTAL_CHANGES=$((TOTAL_CHANGES + COMPONENT_CHANGES))
          else
            TOTAL_CHANGES=$((TOTAL_CHANGES + 1))
          fi

          if [ "$TOTAL_CHANGES" -gt 0 ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate branch name
        id: branch-name
        if: steps.check-changes.outputs.has_changes == 'true'
        run: |
          TIMESTAMP=$(date +'%Y%m%d-%H%M%S')
          BRANCH_NAME="design-tokens/${TIMESTAMP}"
          echo "branch_name=${BRANCH_NAME}" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.check-changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: ${{ fromJson(env.CONFIG).github.commitMessage }}
          title: ${{ fromJson(env.CONFIG).github.prTitle }}
          body: |
            ## Design Tokens Sync
            
            Automated sync of design tokens from Figma.
            
            ### Changes Summary
            - Updated design token snapshots
            - Regenerated CSS files
            - Updated published component snapshots
            
            ### Review Checklist
            - [ ] CSS output looks correct
            - [ ] No unexpected token deletions/renames
            - [ ] Figma version in snapshot key is accurate
          branch: ${{ steps.branch-name.outputs.branch_name }}
          delete-branch: true
          labels: design-tokens,automated
        env:
          CONFIG: '{"github": {"commitMessage": "chore: sync design tokens from Figma", "prLabels": ["design-tokens", "automated"]}}'

      - name: Log sync summary
        run: |
          echo "✅ Design tokens sync completed"
          if [ "${{ steps.check-changes.outputs.has_changes }}" = "true" ]; then
            echo "📝 Pull request created: ${{ steps.branch-name.outputs.branch_name }}"
          else
            echo "ℹ️  No changes detected"
          fi
