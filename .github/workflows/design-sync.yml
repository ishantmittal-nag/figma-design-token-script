name: Design Tokens Sync

on:
  schedule:
    # Run every day at midnight UTC (adjust timezone as needed)
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub UI

jobs:
  sync-tokens:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync Figma tokens
        id: sync
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          # Prefer the FIGMA_FILE_KEY repo Variable (Settings > Secrets and
          # variables > Actions > Variables) - not sensitive, just an
          # identifier, so it's editable from the GitHub UI without a code
          # change. secrets.FIGMA_FILE_KEY is kept as a fallback for repos
          # that haven't added the Variable yet.
          FIGMA_FILE_KEY: ${{ vars.FIGMA_FILE_KEY || secrets.FIGMA_FILE_KEY }}
        run: |
          node sync-figma-tokens.js
          EXIT_CODE=$?
          echo "sync_exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          exit 0

      - name: Sync Figma components
        id: sync-components
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          # Prefer the FIGMA_FILE_KEY repo Variable (Settings > Secrets and
          # variables > Actions > Variables) - not sensitive, just an
          # identifier, so it's editable from the GitHub UI without a code
          # change. secrets.FIGMA_FILE_KEY is kept as a fallback for repos
          # that haven't added the Variable yet.
          FIGMA_FILE_KEY: ${{ vars.FIGMA_FILE_KEY || secrets.FIGMA_FILE_KEY }}
        run: |
          node sync-figma-components.js
          EXIT_CODE=$?
          echo "sync_exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          exit 0

      - name: Check for changes
        id: check-changes
        run: |
          # Gate on the diff summaries the scripts themselves computed, not a
          # raw `git diff`: diff-latest.json's own timestamp field and a
          # freshly-created snapshot entry make the working tree differ on
          # every run even when nothing actually changed, which would
          # otherwise open a no-op PR every day.
          TOTAL_CHANGES=0

          if [ -f tokens/diff-latest.json ]; then
            TOKEN_CHANGES=$(jq '.summary.added + .summary.removed + .summary.modified + .summary.renamed' tokens/diff-latest.json)
            TOTAL_CHANGES=$((TOTAL_CHANGES + TOKEN_CHANGES))
          else
            # No previous snapshot to diff against yet - first run, always sync.
            TOTAL_CHANGES=$((TOTAL_CHANGES + 1))
          fi

          if [ -f components/diff-latest.json ]; then
            COMPONENT_CHANGES=$(jq '.summary.added + .summary.removed + .summary.modified + .summary.renamed' components/diff-latest.json)
            TOTAL_CHANGES=$((TOTAL_CHANGES + COMPONENT_CHANGES))
          else
            TOTAL_CHANGES=$((TOTAL_CHANGES + 1))
          fi

          if [ "$TOTAL_CHANGES" -gt 0 ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Extract breaking changes info
        id: breaking-changes
        if: steps.check-changes.outputs.has_changes == 'true'
        run: |
          TOKEN_BREAKING=0
          if [ -f tokens/diff-latest.json ]; then
            TOKEN_BREAKING=$(jq '.summary.breakingChanges' tokens/diff-latest.json)
          fi

          COMPONENT_BREAKING=0
          if [ -f components/diff-latest.json ]; then
            COMPONENT_BREAKING=$(jq '.summary.breakingChanges' components/diff-latest.json)
          fi

          TOTAL_BREAKING=$((TOKEN_BREAKING + COMPONENT_BREAKING))
          echo "breaking_count=$TOTAL_BREAKING" >> $GITHUB_OUTPUT

          if [ "$TOTAL_BREAKING" -gt 0 ]; then
            echo "has_breaking=true" >> $GITHUB_OUTPUT
          else
            echo "has_breaking=false" >> $GITHUB_OUTPUT
          fi

      - name: Extract component changes info
        id: component-changes
        if: steps.check-changes.outputs.has_changes == 'true'
        run: |
          delimiter="ghadelimiter_$(date +%s%N)"

          COMPONENT_LIST=""
          if [ -f components/diff-latest.json ]; then
            COMPONENT_LIST=$(jq -r '
              def line(prefix; item): "- \(prefix) **\(item.name // item.currentName)**" +
                (if item.codeLocation then " → `\(item.codeLocation)`" else " _(no Code Connect mapping found)_" end);
              ((.changes.added // [])[]    | line("➕ Added:";    .)),
              ((.changes.removed // [])[]  | line("➖ Removed:";  .)),
              ((.changes.modified // [])[] | line("♻️ Modified:"; .)),
              ((.changes.renamed // [])[]  | line("✏️ Renamed:";  .))
            ' components/diff-latest.json)
          fi

          if [ -z "$COMPONENT_LIST" ]; then
            COMPONENT_LIST="_No component changes in this sync._"
          fi

          {
            echo "list<<$delimiter"
            echo "$COMPONENT_LIST"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Generate branch name
        id: branch-name
        if: steps.check-changes.outputs.has_changes == 'true'
        run: |
          TIMESTAMP=$(date +'%Y%m%d-%H%M%S')
          BRANCH_NAME="design-tokens/${TIMESTAMP}"
          echo "branch_name=${BRANCH_NAME}" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.check-changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: ${{ fromJson(env.CONFIG).github.commitMessage }}
          title: ${{ steps.breaking-changes.outputs.has_breaking == 'true' && '⚠️ ' || '✅ ' }}${{ fromJson(env.CONFIG).github.prTitle }}
          body: |
            ## Design Tokens Sync
            
            Automated sync of design tokens from Figma.
            
            ${{ steps.breaking-changes.outputs.has_breaking == 'true' && format('### ⚠️ BREAKING CHANGES DETECTED\n\n**Breaking Changes Found:** {0}\n\nThis PR contains breaking changes that may require updates in the codebase. Please review carefully before merging.\n\n', steps.breaking-changes.outputs.breaking_count) || '### ✅ No Breaking Changes\nThis update is backward compatible.' }}
            
            ### Changes Summary
            - Updated design token snapshots
            - Regenerated CSS files
            - Updated published component snapshots

            **Diff Report Available:** See `tokens/diff-latest.json` for detailed token changes, `components/diff-latest.json` for detailed component changes

            ### Components Changed
            ${{ steps.component-changes.outputs.list }}

            ### Files Changed
            - `tokens/variables-latest.json` - Latest variables
            - `tokens/snapshots/` - Timestamped + versioned snapshots
            - `tokens/*.css` - Generated CSS files
            - `tokens/index.css` - CSS imports index
            - `tokens/diff-latest.json` - Token change report
            - `components/components-latest.json` - Latest published components
            - `components/snapshots/` - Timestamped component snapshots
            - `components/diff-latest.json` - Component change report

            ### Review Checklist
            - [ ] CSS output looks correct
            - [ ] Review breaking changes (if any)
            - [ ] No unexpected token deletions/renames
            - [ ] No unexpected component deletions/renames - check the code locations listed above
            - [ ] Figma version in snapshot key is accurate
            
            Auto-generated by Design Tokens Sync workflow.
          branch: ${{ steps.branch-name.outputs.branch_name }}
          delete-branch: true
          labels: design-tokens,automated${{ steps.breaking-changes.outputs.has_breaking == 'true' && ',breaking-changes' || '' }}
        env:
          CONFIG: '{"github": {"commitMessage": "chore: sync design tokens from Figma", "prLabels": ["design-tokens", "automated"]}}'

      - name: Log sync summary
        run: |
          echo "✅ Design tokens sync completed"
          if [ "${{ steps.check-changes.outputs.has_changes }}" = "true" ]; then
            echo "📝 Pull request created: ${{ steps.branch-name.outputs.branch_name }}"
          else
            echo "ℹ️  No changes detected"
          fi
