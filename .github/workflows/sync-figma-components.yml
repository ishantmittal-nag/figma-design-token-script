name: Sync Figma Components

# Dedicated, components-only counterpart to design-sync.yml (which runs
# both tokens and components together on a schedule). This one is
# manual-trigger only - it's for someone who wants to sync just components
# on demand without also running the tokens sync. Like design-sync.yml, it
# opens a PR rather than pushing straight to main, so a bad or unexpected
# sync gets a review step before landing.
on:
  workflow_dispatch:
    inputs:
      figma_file_key:
        description: "Figma file key to sync (overrides the FIGMA_FILE_KEY repo variable for this run)"
        required: false
      figma_api_base_url:
        description: "Figma API base URL (overrides the FIGMA_API_BASE_URL repo variable for this run; leave blank for the default Figma API)"
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-components:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Sync Figma components
        id: sync
        env:
          # FIGMA_TOKEN is the only actual credential here, so it stays a
          # secret. FIGMA_FILE_KEY and the API base URL are just config, not
          # secrets - they come from repo Variables (Settings > Secrets and
          # variables > Actions > Variables) so they can be changed from the
          # GitHub UI without touching code, with a per-run override via the
          # workflow_dispatch inputs above. secrets.FIGMA_FILE_KEY is a
          # transitional fallback for repos that haven't added the
          # FIGMA_FILE_KEY repo Variable yet.
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          FIGMA_FILE_KEY: ${{ inputs.figma_file_key || vars.FIGMA_FILE_KEY || secrets.FIGMA_FILE_KEY }}
          FIGMA_API_BASE_URL: ${{ inputs.figma_api_base_url || vars.FIGMA_API_BASE_URL }}
          DOTENV_CONFIG_QUIET: "true"
        run: |
          set +e
          node sync-figma-components.js
          CODE=$?
          set -e
          echo "sync_exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      # Gate on the diff summary the script itself computed, not a raw
      # `git diff`: diff-latest.json's own timestamp field and a freshly
      # created snapshot entry make the working tree differ on every run
      # even when nothing actually changed, which would otherwise open a
      # no-op PR on every trigger.
      - name: Check for changes
        id: check-changes
        run: |
          CHANGES=0
          if [ -f components/diff-latest.json ]; then
            CHANGES=$(jq '.summary.added + .summary.removed + .summary.modified + .summary.renamed' components/diff-latest.json)
          else
            CHANGES=1
          fi
          if [ "$CHANGES" -gt 0 ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      # GitHub Actions expression strings don't process backslash escapes -
      # a literal \n inside a ${{ ... }} ternary/format() ends up in the PR
      # body as the two characters \n, not a line break. Building the full
      # message here (with real newlines) as a step output, via the same
      # heredoc-delimiter technique the component-changes list already uses
      # below, sidesteps that instead of fighting the expression syntax.
      - name: Extract breaking changes info
        id: breaking-changes
        if: steps.check-changes.outputs.has_changes == 'true'
        run: |
          BREAKING=0
          if [ -f components/diff-latest.json ]; then
            BREAKING=$(jq '.summary.breakingChanges' components/diff-latest.json)
          fi
          echo "breaking_count=$BREAKING" >> "$GITHUB_OUTPUT"

          delimiter="ghadelimiter_$(date +%s%N)"
          if [ "$BREAKING" -gt 0 ]; then
            echo "has_breaking=true" >> "$GITHUB_OUTPUT"
            MESSAGE="### ⚠️ BREAKING CHANGES DETECTED

          **Breaking Changes Found:** ${BREAKING}

          This PR contains breaking changes that may require updates in the codebase. Please review carefully before merging."
          else
            echo "has_breaking=false" >> "$GITHUB_OUTPUT"
            MESSAGE="### ✅ No Breaking Changes
          This update is backward compatible."
          fi
          {
            echo "message<<$delimiter"
            echo "$MESSAGE"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Extract component changes info
        id: component-changes
        if: steps.check-changes.outputs.has_changes == 'true'
        run: |
          delimiter="ghadelimiter_$(date +%s%N)"
          COMPONENT_LIST=$(jq -r '
            def line(prefix; item): "- \(prefix) **\(item.name // item.currentName)**" +
              (if item.codeLocation then " → `\(item.codeLocation)`" else " _(no Code Connect mapping found)_" end);
            ((.changes.added // [])[]    | line("➕ Added:";    .)),
            ((.changes.removed // [])[]  | line("➖ Removed:";  .)),
            ((.changes.modified // [])[] | line("♻️ Modified:"; .)),
            ((.changes.renamed // [])[]  | line("✏️ Renamed:";  .))
          ' components/diff-latest.json)
          if [ -z "$COMPONENT_LIST" ]; then
            COMPONENT_LIST="_No component changes in this sync._"
          fi
          {
            echo "list<<$delimiter"
            echo "$COMPONENT_LIST"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Generate branch name
        id: branch-name
        if: steps.check-changes.outputs.has_changes == 'true'
        run: |
          TIMESTAMP=$(date +'%Y%m%d-%H%M%S')
          echo "branch_name=sync-components/${TIMESTAMP}" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        if: steps.check-changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: "chore: sync design components from Figma"
          title: "${{ steps.breaking-changes.outputs.has_breaking == 'true' && '⚠️ chore: sync design components from Figma' || '✅ chore: sync design components from Figma' }}"
          body: |
            ## Figma Components Sync

            Automated sync of published components from Figma.

            ${{ steps.breaking-changes.outputs.message }}

            **Diff Report Available:** See `components/diff-latest.json` for detail.

            ### Components Changed
            ${{ steps.component-changes.outputs.list }}

            ### Files Changed
            - `components/components-latest.json` - Latest published components
            - `components/snapshots/` - Timestamped component snapshots
            - `components/code-connect-map.json` - Component → code location mapping
            - `components/diff-latest.json` - Component change report

            ### Review Checklist
            - [ ] Review breaking changes (if any)
            - [ ] No unexpected component deletions/renames - check the code locations listed above

            Auto-generated by Sync Figma Components workflow.
          branch: ${{ steps.branch-name.outputs.branch_name }}
          delete-branch: true
          labels: components,automated${{ steps.breaking-changes.outputs.has_breaking == 'true' && ',breaking-changes' || '' }}

      - name: Log sync summary
        run: |
          if [ "${{ steps.sync.outputs.sync_exit_code }}" != "0" ]; then
            echo "⚠️  sync-figma-components.js exited with code ${{ steps.sync.outputs.sync_exit_code }} - check the 'Sync Figma components' step's log above (could be a real error, or breaking changes were detected)."
          fi
          echo "✅ Figma components sync completed"
          if [ "${{ steps.check-changes.outputs.has_changes }}" = "true" ]; then
            echo "📝 Pull request opened: ${{ steps.branch-name.outputs.branch_name }}"
          else
            echo "ℹ️  No changes detected"
          fi
